<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>To Do List 2026</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;display:flex;justify-content:center;padding:2rem 1rem;min-height:100vh;}
.wrap{width:100%;max-width:900px;border:1px solid #e0e0e0;border-radius:12px;overflow:hidden;background:#fff;}
.header{padding:22px 24px 18px;display:flex;align-items:flex-start;justify-content:space-between;border-bottom:1px solid #f0f0f0;}
.header h1{font-size:20px;font-weight:600;color:#1a1a1a;}
.header p{font-size:13px;color:#999;margin-top:3px;}
.pct-ring{width:52px;height:52px;position:relative;flex-shrink:0;}
.pct-ring svg{width:52px;height:52px;}
.ring-bg{fill:none;stroke:#ebebeb;stroke-width:4;}
.ring-fill{fill:none;stroke:#534AB7;stroke-width:4;stroke-linecap:round;stroke-dasharray:126;stroke-dashoffset:126;transition:stroke-dashoffset .4s;transform:rotate(-90deg);transform-origin:26px 26px;}
.pct-ring span{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:11px;font-weight:600;color:#534AB7;}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#f0f0f0;border-bottom:1px solid #f0f0f0;}
.metric{padding:14px 16px;background:#fff;}
.metric-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;font-size:15px;}
.mi-total{background:#EEEDFE;color:#534AB7;}.mi-done{background:#E1F5EE;color:#0F6E56;}.mi-pend{background:#FAEEDA;color:#854F0B;}.mi-urg{background:#FAECE7;color:#993C1D;}
.metric-val{font-size:22px;font-weight:600;color:#1a1a1a;}
.metric-lbl{font-size:11px;color:#aaa;margin-top:2px;}
.prog-track{height:3px;background:#f0f0f0;}.prog-fill{height:3px;background:#534AB7;transition:width .35s;}
.toolbar{padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fafafa;border-bottom:1px solid #f0f0f0;}
.toolbar input,.toolbar select{font-size:13px;padding:6px 10px;border:1px solid #e0e0e0;border-radius:8px;background:#fff;color:#1a1a1a;outline:none;}
.toolbar input:focus,.toolbar select:focus{border-color:#534AB7;}
#inp-date{width:140px;}#inp-date::-webkit-calendar-picker-indicator{cursor:pointer;opacity:.6;}#inp-date::-webkit-calendar-picker-indicator:hover{opacity:1;}#inp-customer{width:130px;}#inp-task{flex:1;min-width:100px;}#inp-priority{width:120px;}
.add-btn{font-size:13px;padding:6px 16px;background:#534AB7;color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:500;display:flex;align-items:center;gap:5px;white-space:nowrap;}
.add-btn:hover{background:#3C3489;}.add-btn:active{transform:scale(.98);}
.filter-bar{display:flex;gap:5px;padding:8px 14px;border-bottom:1px solid #f0f0f0;}
.ftab{font-size:12px;padding:3px 12px;border-radius:20px;border:1px solid #e0e0e0;background:none;cursor:pointer;color:#888;}
.ftab.active{background:#EEEDFE;color:#534AB7;border-color:#AFA9EC;font-weight:500;}
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed;}
thead tr{background:#fafafa;border-bottom:1px solid #e8e8e8;}
thead th{padding:8px 12px;text-align:left;font-weight:500;font-size:11px;color:#aaa;letter-spacing:.04em;}
thead th:first-child{width:36px;text-align:center;}thead th:nth-child(2){width:80px;}thead th:nth-child(3){width:130px;}thead th:nth-child(5){width:96px;}thead th:last-child{width:36px;}
tbody tr{border-bottom:1px solid #f5f5f5;}tbody tr:last-child{border-bottom:none;}tbody tr:hover{background:#fafafa;}
tbody td{padding:9px 12px;color:#1a1a1a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
tbody td:first-child{text-align:center;}
.done-row td{color:#bbb;}.strike{text-decoration:line-through;}
input[type="checkbox"]{width:14px;height:14px;accent-color:#534AB7;cursor:pointer;}
.badge{font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;display:inline-block;}
.b-high{background:#FAECE7;color:#993C1D;}.b-medium{background:#FAEEDA;color:#854F0B;}.b-low{background:#E1F5EE;color:#0F6E56;}
.del-btn{background:none;border:none;cursor:pointer;color:#ccc;font-size:15px;padding:2px 4px;border-radius:4px;}
.del-btn:hover{color:#D85A30;background:#FAECE7;}
.empty{text-align:center;padding:2.5rem;color:#bbb;font-size:13px;}
.err-bar{background:#FAECE7;color:#993C1D;font-size:13px;padding:10px 16px;border-bottom:1px solid #f5c4b3;display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div><h1>To Do List 2026</h1><p id="counter">กำลังโหลด...</p></div>
    <div class="pct-ring">
      <svg viewBox="0 0 52 52"><circle class="ring-bg" cx="26" cy="26" r="20"/><circle class="ring-fill" id="ring" cx="26" cy="26" r="20"/></svg>
      <span id="pct-txt">0%</span>
    </div>
  </div>
  <div class="metrics">
    <div class="metric"><div class="metric-icon mi-total"><i class="ti ti-list"></i></div><div class="metric-val" id="m-total">—</div><div class="metric-lbl">ทั้งหมด</div></div>
    <div class="metric"><div class="metric-icon mi-done"><i class="ti ti-circle-check"></i></div><div class="metric-val" id="m-done">—</div><div class="metric-lbl">เสร็จแล้ว</div></div>
    <div class="metric"><div class="metric-icon mi-pend"><i class="ti ti-clock"></i></div><div class="metric-val" id="m-pending">—</div><div class="metric-lbl">ยังค้างอยู่</div></div>
    <div class="metric"><div class="metric-icon mi-urg"><i class="ti ti-alert-triangle"></i></div><div class="metric-val" id="m-urgent">—</div><div class="metric-lbl">เร่งด่วน</div></div>
  </div>
  <div class="prog-track"><div class="prog-fill" id="prog" style="width:0%"></div></div>
  <div class="err-bar" id="err-bar"></div>
  <div class="toolbar">
    <input type="date" id="inp-date" />
    <input type="text" id="inp-customer" placeholder="Customer" />
    <input type="text" id="inp-task" placeholder="Task..." />
    <select id="inp-priority">
      <option value="high">เร่งด่วน</option>
      <option value="medium" selected>ปานกลาง</option>
      <option value="low">ไม่เร่งด่วน</option>
    </select>
    <button class="add-btn" onclick="addTask()"><i class="ti ti-plus" style="font-size:14px"></i> Add</button>
  </div>
  <div class="filter-bar">
    <button class="ftab active" onclick="setF('all',this)">ทั้งหมด</button>
    <button class="ftab" onclick="setF('pending',this)">ค้างอยู่</button>
    <button class="ftab" onclick="setF('done',this)">เสร็จแล้ว</button>
    <button class="ftab" onclick="setF('high',this)">เร่งด่วน</button>
  </div>
  <table>
    <thead><tr><th></th><th>Date</th><th>Customer</th><th>Task</th><th>Priority</th><th></th></tr></thead>
    <tbody id="tbody"><tr><td colspan="6" class="empty">กำลังโหลด...</td></tr></tbody>
  </table>
</div>
<script>
// ================================================================
//  วาง URL ของ Web App ที่ได้จาก Google Apps Script ตรงนี้
//  ตัวอย่าง: "https://script.google.com/macros/s/AKfyc.../exec"
// ================================================================
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwx8gYbv1O4NIJKXgug27i9HfJlVfWHB5qdaBAhN5KSiuKfRd5NF1-_D1yzpzDP7Zc5/exec";

let tasks=[], filt='all';
const pLabel={high:'เร่งด่วน',medium:'ปานกลาง',low:'ไม่เร่งด่วน'};
const pClass={high:'b-high',medium:'b-medium',low:'b-low'};

function showErr(msg){const b=document.getElementById('err-bar');b.textContent=msg;b.style.display='block';setTimeout(()=>b.style.display='none',4000);}
async function api(body){const r=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify(body)});return r.json();}

async function loadTasks(){
  try{
    const data=await fetch(SCRIPT_URL+"?action=getTasks").then(r=>r.json());
    tasks=data.tasks||[];render();
  }catch(e){
    showErr("เชื่อมต่อ Google Sheets ไม่ได้ — ตรวจสอบ SCRIPT_URL");
    document.getElementById('tbody').innerHTML='<tr><td colspan="6" class="empty">ไม่สามารถโหลดข้อมูลได้</td></tr>';
  }
}

async function addTask(){
  const rawDate=document.getElementById('inp-date').value;
  const customer=document.getElementById('inp-customer').value.trim();
  const task=document.getElementById('inp-task').value.trim();
  const priority=document.getElementById('inp-priority').value;
  if(!task){document.getElementById('inp-task').focus();return;}
  let date='-';
  if(rawDate){const d=new Date(rawDate);const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];date=months[d.getMonth()]+'-'+d.getDate();}
  try{
    const r=await api({action:'addTask',date,customer,task,priority});
    if(r.success){tasks.push({id:r.id,date:date,customer:customer||'-',task,priority,done:false});['inp-date','inp-customer','inp-task'].forEach(id=>document.getElementById(id).value='');render();}
  }catch(e){showErr("เพิ่มงานไม่สำเร็จ");}
}

async function toggle(id){
  const t=tasks.find(t=>t.id==id);if(t){t.done=!t.done;render();}
  try{await api({action:'toggleTask',id});}catch(e){showErr("อัปเดตสถานะไม่สำเร็จ");}
}

async function del(id){
  tasks=tasks.filter(t=>t.id!=id);render();
  try{await api({action:'deleteTask',id});}catch(e){showErr("ลบงานไม่สำเร็จ");}
}

function setF(f,el){filt=f;document.querySelectorAll('.ftab').forEach(b=>b.classList.remove('active'));el.classList.add('active');render();}
document.getElementById('inp-task').addEventListener('keydown',e=>{if(e.key==='Enter')addTask();});

function render(){
  const total=tasks.length,done=tasks.filter(t=>t.done).length,pct=total?Math.round(done/total*100):0;
  document.getElementById('counter').textContent=done+' / '+total+' complete';
  document.getElementById('pct-txt').textContent=pct+'%';
  document.getElementById('ring').style.strokeDashoffset=126-(126*pct/100);
  document.getElementById('m-total').textContent=total;
  document.getElementById('m-done').textContent=done;
  document.getElementById('m-pending').textContent=total-done;
  document.getElementById('m-urgent').textContent=tasks.filter(t=>t.priority==='high'&&!t.done).length;
  document.getElementById('prog').style.width=pct+'%';
  let vis=tasks;
  if(filt==='pending')vis=tasks.filter(t=>!t.done);
  else if(filt==='done')vis=tasks.filter(t=>t.done);
  else if(filt==='high')vis=tasks.filter(t=>t.priority==='high');
  const tbody=document.getElementById('tbody');
  if(!vis.length){tbody.innerHTML='<tr><td colspan="6" class="empty">ไม่มีรายการ</td></tr>';return;}
  tbody.innerHTML=vis.map(t=>`
    <tr class="${t.done?'done-row':''}">
      <td><input type="checkbox" ${t.done?'checked':''} onchange="toggle('${t.id}')" /></td>
      <td class="${t.done?'strike':''}">${t.date}</td>
      <td class="${t.done?'strike':''}">${t.customer}</td>
      <td class="${t.done?'strike':''}" title="${t.task}">${t.task}</td>
      <td><span class="badge ${pClass[t.priority]}">${pLabel[t.priority]}</span></td>
      <td><button class="del-btn" onclick="del('${t.id}')"><i class="ti ti-trash"></i></button></td>
    </tr>`).join('');
}

loadTasks();
</script>
</body>
</html>
